<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="panel.css" />
  </head>
  <body>
    <div class="toolbar">
      <button id="btnToggle" class="btn btn-primary" title="Pause/resume capture">⏸ Pause</button>
      <button id="btnClear" class="btn" title="Clear captured requests">🗑 Clear</button>

      <input id="search" type="text" placeholder="Filter by URL, method, status…" />

      <label class="checkbox">
        <input type="checkbox" id="redact" checked />
        Redact Authorization / Cookie headers
      </label>

      <span class="spacer"></span>

      <span id="count" class="count">0 requests</span>

      <div class="dropdown">
        <button id="btnExport" class="btn btn-accent">⬇ Export ▾</button>
        <div id="exportMenu" class="dropdown-menu hidden">
          <button data-format="postman">Postman Collection (.json)</button>
          <button data-format="har">HAR (.har)</button>
          <button data-format="curl">curl commands (.sh)</button>
        </div>
      </div>
    </div>

    <table id="requestsTable">
      <thead>
        <tr>
          <th class="col-method">Method</th>
          <th class="col-status">Status</th>
          <th class="col-domain">Domain</th>
          <th class="col-path">Path</th>
          <th class="col-type">Type</th>
          <th class="col-size">Size</th>
          <th class="col-time">Time</th>
        </tr>
      </thead>
      <tbody id="requestsBody"></tbody>
    </table>

    <div id="empty" class="empty">
      Reload the page to start capturing requests. Nothing is sent anywhere —
      everything stays in this DevTools panel until you export it.
    </div>

    <script src="export.js"></script>
    <script src="panel.js"></script>
  </body>
</html>
